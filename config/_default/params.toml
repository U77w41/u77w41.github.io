# Sections listed on the home page.
mainSections   = ["post"]
rssFullContent = true
favicon        = "/favicon.ico"

[footer]
    since = 2024

[dateFormat]
    published   = ":date_medium"
    lastUpdated = ":date_medium"

[sidebar]
    compact  = false
    subtitle = "Data Scientist, Fraud & Risk Analytics @ RBIH"
    avatar   = "img/avatar.png"

[article]
    math        = false
    toc         = true
    readingTime = false

    [article.list]
        showTags = false

# No right-hand sidebar on the home page; table of contents on project pages.
[widgets]
    homepage = []
    page     = [{ type = "toc" }]

[opengraph.twitter]
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    default = "auto"

[comments]
    enabled = false
