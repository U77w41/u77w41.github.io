name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: # lets you re-run a deploy from the Actions tab

permissions:
  contents: write # needed to push the built site to the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Pinned on purpose. Change it only after testing a newer Hugo locally (see README).
  HUGO_VERSION: "0.168.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        run: hugo --minify --gc

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean: true
          single-commit: true
